<!DOCTYPE html>
<html>
<head>
<style>
#demo,#blink{
	font-family:"Courier New", Courier, monospace;
	font-size:40px;
	display:inline;
}
#demo{
text-align:justify;
}

#content{
	height:100%;
	overflow: auto;
	position:relative;
}
html,body{
	margin:0px;
	height:100%;
	display:relative;
	background-color:skyblue;
	color:#292693;
}
#alg{
	text-align:center;
	position: sticky;
	left: 50%;
	top: 30%;
}
#bg{
	position:relative;
	left:0px;
	max-width: 100%;
	max-height: 100%;
}

#chat{
	border-radius:100%;
	position:absolute;
	box-shadow: 1px 2px 10px rgba(0, 0, 0, .3);
	right: 2px;
	bottom: 3px;
	height:65px;
	width:auto;
	animation: shake 0.1s;
	animation-iteration-count: infinite;
}
#lngth{
	color:#9b0173;
	border-radius:20px 50px 50px 20px;
	width:13%;
	right: 20px;
	bottom: 20px;
	position:absolute;
	font-size:23px;
	box-shadow: 1px 2px 10px rgba(0, 0, 0, .5);
	background-color:#f356c9;
}
#text{
	padding-left:10px;
}

#chat:hover { 
	animation-play-state: paused;
}
@keyframes shake {
	0% { transform: translate(0px, 0px) rotate(0deg); }
	25% { transform: translate(2px, 0px) rotate(0deg); }
	75% { transform: translate(-2px, 0px) rotate(0deg); }
	100% { transform: translate(0px, 0px) rotate(0deg); }
}
</style>
</head>


<body onload="main()">

	<div id="content">
		<img src="ac.jpg" align="left" id="bg">
		<div id="alg">
			<p id="demo"></p><p id="blink">_</p>
		</div>
		<a href="https://www.google.com">
			<div id="lngth" ">
			<img src="adse.png" id="chat" align="bottom">
			<p class="chat" id="text">Chat here</p>
			</div>
		</a>
	</div>

<script>
var i=0;
var j=0;
var k=0;
var txt = 'Global Support Live Chat and some';
var chng = ["more","24X7"];
var speed = 200;
blink();
function main() {
    setTimeout(delet, speed); 
    setTimeout(typeWriter, speed);    
    setTimeout(main, speed);
}

function delet() {
if (i >= txt.length) {
    txt=txt.slice(0,-4);
    document.getElementById("demo").innerHTML = txt;
    txt=txt+chng[k];
    k++;
    if (k>1)
    k=0;
    i-=5;
    speed=500;
	}
}

function typeWriter() {
  if (i < txt.length) {
    document.getElementById("demo").innerHTML += txt.charAt(i);
    i++;
	}
  if(i >= txt.length){
    speed=1500;
	}
}

function blink() {
    var yourUl=document.getElementById("blink");
    yourUl.style.opacity = yourUl.style.opacity === '0' ? '1' : '0';
    setTimeout(blink, 100);
}

</script>

</body>
</html>
